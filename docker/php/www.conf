[global]
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/www/html/storage/logs/php-error.log
php_admin_flag[log_errors] = on
